{% extends 'base.html' %}
{% block titre %}Mot de passe{% endblock %}
{% block contenu %}
<div class="entete-page"><div><h1>Changer de mot de passe</h1></div></div>
<div class="carte" style="max-width:440px">
  <form method="post">
    <div class="champ"><label>Mot de passe actuel</label><input type="password" name="ancien" required></div>
    <div class="champ"><label>Nouveau mot de passe</label><input type="password" name="nouveau" required minlength="6"></div>
    <div class="champ"><label>Confirmation</label><input type="password" name="confirmation" required minlength="6"></div>
    <button class="btn btn-principal">Enregistrer</button>
  </form>
</div>
{% endblock %}
