{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:800px; margin:0 auto;">

    <div style="text-align:center; margin-bottom:28px;">
        <div style="font-size:32px; margin-bottom:12px;">⚙️</div>
        <h1 style="margin:0;">Analyse en cours</h1>
        <p style="color:#888; margin-top:6px; font-size:13px;">
            {{ operateur.upper() }} — {{ chemin }}
        </p>
    </div>

    <!-- Étape courante -->
    <div id="etape-box" style="background:#e3f2fd; border-left:4px solid #1565c0;
         padding:12px 16px; border-radius:4px; margin-bottom:20px; font-size:14px;
         font-weight:500; color:#1565c0; display:none;">
        <span id="etape-texte">Initialisation…</span>
    </div>

    <!-- Barre de progression visuelle -->
    <div style="background:#f0f0f0; border-radius:20px; height:8px; margin-bottom:20px; overflow:hidden;">
        <div id="progress-bar"
             style="height:100%; width:0%; background:linear-gradient(90deg,#1565c0,#42a5f5);
                    border-radius:20px; transition:width 0.4s ease;">
        </div>
    </div>

    <!-- Console des logs -->
    <div style="background:#1a1a2e; border-radius:6px; padding:16px;
                height:320px; overflow-y:auto; font-family:monospace;
                font-size:12px; line-height:1.7;" id="console">
        <span style="color:#888;">En attente du démarrage…</span>
    </div>

    <!-- Statut final -->
    <div id="statut-final" style="display:none; margin-top:20px; text-align:center;">
        <a href="{{ url_for('resultats') }}" class="btn btn-primary"
           style="padding:12px 32px; font-size:15px;">
            Voir les résultats →
        </a>
    </div>

    <div id="erreur-final" style="display:none; margin-top:20px;">
        <div class="flash danger" id="erreur-msg"></div>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">← Retour</a>
    </div>
</div>

<script>
const console_div  = document.getElementById('console');
const etapeBox     = document.getElementById('etape-box');
const etapeTexte   = document.getElementById('etape-texte');
const progressBar  = document.getElementById('progress-bar');
const statutFinal  = document.getElementById('statut-final');
const erreurFinal  = document.getElementById('erreur-final');
const erreurMsg    = document.getElementById('erreur-msg');

// Couleurs selon le niveau
const COULEURS = {
    ok   : '#4caf50',
    warn : '#ff9800',
    info : '#90caf9',
    err  : '#ef5350',
};

// Étapes connues → progression estimée
const ETAPES = [
    "Chargement des fichiers",
    "Analyse en cours",
    "Génération du tableau de synthèse",
    "Ventilation par type de pièce",
    "Extraction des KPI",
];
let etapeIdx = 0;

function avancerProgress(texte) {
    const idx = ETAPES.findIndex(e => texte.includes(e));
    if (idx >= 0 && idx >= etapeIdx) {
        etapeIdx = idx + 1;
    }
    const pct = Math.min(Math.round((etapeIdx / ETAPES.length) * 90), 90);
    progressBar.style.width = pct + '%';
}

function ajouterLog(texte, couleur = '#90caf9') {
    const line = document.createElement('div');
    line.style.color = couleur;
    line.textContent = texte;
    console_div.appendChild(line);
    console_div.scrollTop = console_div.scrollHeight;
    // Supprime le message d'attente initial
    const attente = console_div.querySelector('span');
    if (attente) attente.remove();
}

// Connexion SSE
const evtSource = new EventSource("{{ url_for('stream') }}");

evtSource.onmessage = function(e) {
    const data = JSON.parse(e.data);

    if (data.type === 'etape') {
        etapeBox.style.display = 'block';
        etapeTexte.textContent = data.msg;
        avancerProgress(data.msg);
        ajouterLog('── ' + data.msg + ' ──', '#42a5f5');
        return;
    }

    if (data.type === 'log') {
        const niv    = data.niveau || 'info';
        const couleur = COULEURS[niv] || COULEURS.info;
        ajouterLog(data.msg, couleur);
        return;
    }

    if (data.type === 'termine') {
        progressBar.style.width = '100%';
        progressBar.style.background = '#4caf50';
        etapeTexte.textContent = '✓ ' + data.msg;
        etapeBox.style.background = '#e8f5e9';
        etapeBox.style.borderColor = '#4caf50';
        etapeBox.style.color = '#2e7d32';
        ajouterLog('✓ ' + data.msg, '#4caf50');
        evtSource.close();
        setTimeout(() => { statutFinal.style.display = 'block'; }, 600);
        return;
    }

    if (data.type === 'erreur') {
        progressBar.style.background = '#ef5350';
        etapeTexte.textContent = '✗ Erreur';
        etapeBox.style.background = '#ffebee';
        etapeBox.style.borderColor = '#ef5350';
        etapeBox.style.color = '#c62828';
        ajouterLog('ERREUR : ' + data.msg, '#ef5350');
        erreurMsg.textContent = 'Erreur : ' + data.msg.split('\n')[0];
        erreurFinal.style.display = 'block';
        evtSource.close();
        return;
    }

    if (data.type === 'ping') {
        // Heartbeat — connexion maintenue, rien à afficher
        return;
    }

    if (data.type === 'timeout') {
        ajouterLog('Timeout — l\'analyse a pris trop de temps.', '#ff9800');
        evtSource.close();
        return;
    }
};

evtSource.onerror = function() {
    ajouterLog('Connexion perdue. Vérifiez la console serveur.', '#ef5350');
    evtSource.close();
};
</script>
{% endblock %}
