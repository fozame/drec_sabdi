# SABDI – déploiement Docker
#   Première installation :   ./scripts/deployer.sh
#   Mise à jour :              ./scripts/mettre_a_jour.sh
# Réglages dans le fichier .env (modèle : env.exemple).

services:
  sabdi:
    build:
      context: .
      args:
        POLARS_RUNTIME: ${SABDI_POLARS_RUNTIME:-}
    image: sabdi:${SABDI_VERSION:-latest}
    container_name: sabdi
    restart: unless-stopped
    ports:
      - "${SABDI_PORT_HOTE:-5600}:5600"
    environment:
      SABDI_SECRET: ${SABDI_SECRET:?Renseigner SABDI_SECRET dans le fichier .env}
      SABDI_ADMIN_PASSWORD: ${SABDI_ADMIN_PASSWORD:-admin123}
      SABDI_THREADS: ${SABDI_THREADS:-8}
      SABDI_DOSSIER: /depots
      TZ: ${TZ:-Africa/Douala}
      _RJEM_MALLOC_CONF: background_thread:true,dirty_decay_ms:0,muzzy_decay_ms:0
    volumes:
      # Données persistantes : base SQLite (utilisateurs, historique), extractions,
      # fichiers téléversés, logo (logo_art.png). À sauvegarder.
      - ${SABDI_DONNEES:-./donnees}:/data
      # Dossiers des opérateurs déposés sur le serveur (lecture seule), accessibles
      # dans l'application par le chemin /depots/...
      - ${SABDI_DEPOTS:-./depots}:/depots:ro
    # Ordre de grandeur : 0,35 Go par million de lignes (BDI + HLR) ; 16 millions ≈ 6 Go.
    mem_limit: ${SABDI_MEMOIRE:-13g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
